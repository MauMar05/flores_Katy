<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cielo-1: #241833;
    --cielo-2: #3a2350;
    --cielo-3: #7a4a52;
    --cielo-4: #d98a4f;
    --amarillo: #F7C948;
    --amarillo-claro: #FCE18C;
    --amarillo-centro: #C9861B;
    --tallo: #3E6B3A;
    --tallo-oscuro: #2C4E29;
    --texto: #FBF4E3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    background: linear-gradient(180deg, var(--cielo-1) 0%, var(--cielo-2) 45%, var(--cielo-3) 75%, var(--cielo-4) 100%);
    font-family: 'Cormorant Garamond', serif;
    position: relative;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  .estrella {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--texto);
    border-radius: 50%;
    opacity: 0;
    animation: parpadeo 4s ease-in-out infinite;
  }

  @keyframes parpadeo {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.7; }
  }

  .escena {
    position: relative;
    width: min(92vw, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 8px;
  }

  .mensaje {
    text-align: center;
    color: var(--texto);
    font-family: 'Caveat', cursive;
    font-size: clamp(28px, 6.2vw, 42px);
    line-height: 1.35;
    max-width: 420px;
    margin: 0 0 10px;
    opacity: 0;
    transform: translateY(8px);
    animation: aparecer 1.4s ease forwards;
    animation-delay: 2.6s;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }

  @keyframes aparecer {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes aparecer-opacidad {
    to { opacity: 1; }
  }

  .ramo-envoltorio {
    width: min(78vw, 320px);
  }

  .ramo-mecer {
    transform-origin: 150px 300px;
    animation: mecer 5s ease-in-out infinite;
    animation-delay: 2.2s;
  }

  @keyframes mecer {
    0%, 100% { transform: rotate(-1.6deg); }
    50% { transform: rotate(1.6deg); }
  }

  .tallo {
    stroke: var(--tallo);
    stroke-width: 5;
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    animation: crecer 1s ease-out forwards;
  }

  .hoja {
    fill: var(--tallo);
    opacity: 0;
    animation: hoja-aparece 0.6s ease-out forwards;
  }

  .petalo {
    fill: var(--amarillo);
    transform-origin: center;
    transform-box: fill-box;
    transform: scale(0);
    animation: florecer 0.7s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  .petalo.claro { fill: var(--amarillo-claro); }

  .centro-flor {
    fill: var(--amarillo-centro);
    transform-origin: center;
    transform-box: fill-box;
    transform: scale(0);
    animation: florecer 0.5s ease-out forwards;
  }

  @keyframes crecer {
    to { stroke-dashoffset: 0; }
  }

  @keyframes hoja-aparece {
    to { opacity: 1; }
  }

  @keyframes florecer {
    to { transform: scale(1); }
  }

  .listón-grupo {
    opacity: 0;
    animation: aparecer-opacidad 0.8s ease forwards;
    animation-delay: 1.7s;
  }

  .firma {
    color: var(--texto);
    opacity: 0.75;
    font-family: 'Caveat', cursive;
    font-size: 20px;
    margin-top: 2px;
    margin-bottom: 24px;
    opacity: 0;
    animation: aparecer 1.2s ease forwards;
    animation-delay: 3.2s;
  }

  /* ---- Pollito ---- */

  .pollito-camina {
    animation: caminar-pollito 2s ease-in-out 4.3s both;
  }

  @keyframes caminar-pollito {
    0%   { transform: translate(-200px, 0); }
    20%  { transform: translate(-160px, -6px); }
    40%  { transform: translate(-120px, 0px); }
    60%  { transform: translate(-80px, -6px); }
    80%  { transform: translate(-40px, 0px); }
    100% { transform: translate(0, 0); }
  }

  .pata-atras {
    transform-origin: -3px 14px;
    animation: pata-a 0.4s ease-in-out 4.3s 5;
  }
  .pata-delante {
    transform-origin: 5px 14px;
    animation: pata-b 0.4s ease-in-out 4.3s 5;
  }

  @keyframes pata-a {
    0%, 100% { transform: rotate(16deg); }
    50% { transform: rotate(-16deg); }
  }
  @keyframes pata-b {
    0%, 100% { transform: rotate(-16deg); }
    50% { transform: rotate(16deg); }
  }

  .ala-pollito {
    animation: agarrar-pollito 0.6s ease-out 6.3s forwards;
  }

  @keyframes agarrar-pollito {
    0%   { transform: rotate(0deg); }
    55%  { transform: rotate(-58deg); }
    75%  { transform: rotate(-38deg); }
    100% { transform: rotate(-46deg); }
  }

  .pico-pollito {
    animation: pico-beso 0.5s ease-in-out 6.95s;
  }

  @keyframes pico-beso {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.35, 0.75); }
  }

  .beso-grupo {
    opacity: 0;
    animation: lanzar-beso 1.8s ease-out 7s forwards;
  }

  @keyframes lanzar-beso {
    0%   { opacity: 0; transform: translate(0,0) scale(0.3); }
    15%  { opacity: 1; transform: translate(2px,-3px) scale(1.1); }
    30%  { opacity: 1; transform: translate(4px,-8px) scale(0.95); }
    70%  { opacity: 0.9; transform: translate(26px,-38px) scale(1.2) rotate(10deg); }
    100% { opacity: 0; transform: translate(40px,-58px) scale(0.7) rotate(18deg); }
  }
</style>
</head>
<body>

<div class="escena">

  <p class="mensaje">
    aunque aún no somos pero lo seremos,<br>
    te dejo tus flores amarillas mi Katy
  </p>

  <div class="ramo-envoltorio">
    <svg viewBox="0 0 300 320" width="100%" style="display:block; overflow:visible;">
      <g class="ramo-mecer">

        <!-- Tallos: todos convergen en el mismo punto (150,300), como un ramo atado -->
        <path class="tallo" d="M150 300 C 110 250 90 190 95 100" style="animation-delay:0.55s"/>
        <path class="tallo" d="M150 300 C 130 240 125 160 130 65" style="animation-delay:0.75s"/>
        <path class="tallo" d="M150 300 C 150 230 160 140 165 55" style="animation-delay:0.95s"/>
        <path class="tallo" d="M150 300 C 170 240 185 160 200 70" style="animation-delay:0.75s"/>
        <path class="tallo" d="M150 300 C 190 250 220 190 235 105" style="animation-delay:0.55s"/>

        <!-- Hojas -->
        <ellipse class="hoja" cx="105" cy="200" rx="13" ry="6" transform="rotate(-40 105 200)" style="animation-delay:1.0s"/>
        <ellipse class="hoja" cx="128" cy="175" rx="13" ry="6" transform="rotate(-15 128 175)" style="animation-delay:1.15s"/>
        <ellipse class="hoja" cx="172" cy="170" rx="13" ry="6" transform="rotate(15 172 170)" style="animation-delay:1.15s"/>
        <ellipse class="hoja" cx="197" cy="195" rx="13" ry="6" transform="rotate(35 197 195)" style="animation-delay:1.0s"/>
        <ellipse class="hoja" cx="150" cy="230" rx="14" ry="6" transform="rotate(0 150 230)" style="animation-delay:1.25s"/>

        <!-- Flores, agrupadas en arco formando la cabeza del ramo -->
        <g data-flor="1" transform="translate(95,100)"></g>
        <g data-flor="2" transform="translate(130,65)"></g>
        <g data-flor="3" transform="translate(165,55)"></g>
        <g data-flor="4" transform="translate(200,70)"></g>
        <g data-flor="5" transform="translate(235,105)"></g>

        <!-- Listón atando los tallos -->
        <g class="listón-grupo" transform="translate(150,300)">
          <path d="M0 -14 C -32 -14 -46 -3 -46 4 C -46 11 -35 14 -28 7 C -28 7 -20 16 0 16 C 20 16 28 7 28 7 C 35 14 46 11 46 4 C 46 -3 32 -14 0 -14Z" fill="#B5473F"/>
          <path d="M0 -14 C -32 -14 -46 -3 -46 4 C -46 11 -35 14 -28 7 C -28 7 -20 16 0 16 C 20 16 28 7 28 7 C 35 14 46 11 46 4 C 46 -3 32 -14 0 -14Z" fill="none" stroke="#8A322C" stroke-width="1.5" opacity="0.5"/>
        </g>

      </g>

      <!-- Pollito que camina, agarra el ramo y tira un beso -->
      <g class="pollito-grupo" transform="translate(108,298) scale(1.6)">
        <g class="pollito-camina">

          <!-- sombra -->
          <ellipse cx="0" cy="26" rx="20" ry="4" fill="#140b24" opacity="0.22"/>

          <!-- patas -->
          <g class="pata pata-atras">
            <line x1="-3" y1="14" x2="-5" y2="27" stroke="#F2B705" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M-5 27 L-9 29 M-5 27 L-5 30 M-5 27 L-1 29" stroke="#F2B705" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="pata pata-delante">
            <line x1="5" y1="14" x2="7" y2="27" stroke="#F2B705" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M7 27 L3 29 M7 27 L7 30 M7 27 L11 29" stroke="#F2B705" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- cola -->
          <path d="M-16 -6 C -28 -14 -30 -2 -22 4 C -26 6 -28 12 -20 12 C -14 12 -12 2 -16 -6Z" fill="#FBF8F2" stroke="#E4DECE" stroke-width="0.6"/>

          <!-- cuerpo -->
          <ellipse cx="0" cy="0" rx="19" ry="18" fill="#FBF8F2"/>

          <!-- pecho moteado -->
          <path d="M-12 4 Q0 18 12 4 Q9 15 0 17 Q-9 15 -12 4Z" fill="#E6E0D0"/>
          <circle cx="-4" cy="9" r="1.3" fill="#B9AF95"/>
          <circle cx="3" cy="11" r="1.1" fill="#B9AF95"/>
          <circle cx="-1" cy="14" r="1" fill="#B9AF95"/>
          <circle cx="6" cy="5" r="1" fill="#B9AF95"/>

          <!-- ala (se anima aparte para no perder la posición) -->
          <g transform="translate(8,-2)">
            <g class="ala-pollito">
              <path d="M0 0 C 10 -2 16 4 15 12 C 14 18 6 19 0 15 C -3 11 -3 3 0 0Z" fill="#8C8D90"/>
              <ellipse cx="6" cy="6" rx="3" ry="2" fill="#6B6C6F" transform="rotate(20 6 6)"/>
              <ellipse cx="9" cy="11" rx="2.6" ry="1.8" fill="#6B6C6F" transform="rotate(20 9 11)"/>
              <ellipse cx="3" cy="11" rx="2.2" ry="1.6" fill="#6B6C6F" transform="rotate(10 3 11)"/>
            </g>
          </g>

          <!-- cabeza -->
          <g transform="translate(17,-16)">
            <!-- cresta -->
            <path d="M-6 -11 C -7 -15 -3 -16 -3 -12 C -1 -16 3 -16 1 -11 C 4 -14 7 -12 3 -9 C 6 -9 6 -6 2 -6 L -6 -6 Z" fill="#C0392B"/>
            <!-- cabeza -->
            <circle cx="0" cy="0" r="11" fill="#FBF8F2"/>
            <!-- ojo -->
            <circle cx="3.5" cy="-1" r="1.6" fill="#241833"/>
            <circle cx="4" cy="-1.6" r="0.5" fill="#fff"/>
            <!-- moco -->
            <path d="M4 6 C 7 6 8 10 5 12 C 3 13 2 10 4 6Z" fill="#C0392B"/>
            <!-- pico -->
            <g transform="translate(10,2)">
              <g class="pico-pollito">
                <path d="M0 -2.5 L7 0 L0 2.5 Z" fill="#F2B705"/>
              </g>
            </g>
          </g>

          <!-- beso -->
          <g transform="translate(27,-14)">
            <g class="beso-grupo">
              <path class="corazon-beso" d="M0 3 C -5 -3 -12 0 -12 6 C -12 12 -4 17 0 21 C 4 17 12 12 12 6 C 12 0 5 -3 0 3Z" fill="#E85D75"/>
            </g>
          </g>

        </g>
      </g>
    </svg>
  </div>

  <p class="firma">21 de septiembre</p>

</div>

<script>
  const body = document.body;
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'estrella';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 55 + 'vh';
    s.style.animationDelay = (Math.random() * 4) + 's';
    body.appendChild(s);
  }

  // Rellena cada <g data-flor> con sus pétalos y centro.
  // La rotación de cada pétalo va en un <g>; el scale animado va en la
  // elipse (CSS). Si van en el mismo elemento, el transform de CSS pisa
  // al transform del SVG y se pierde la rotación.
  function contenidoFlor(escala, retraso, claro) {
    const numPetalos = 8;
    const radioPetalo = 14 * escala;
    const anchoPetalo = 8.5 * escala;
    let html = '';
    for (let i = 0; i < numPetalos; i++) {
      const angulo = (360 / numPetalos) * i;
      const delay = (retraso + i * 0.03).toFixed(2);
      html += `<g transform="rotate(${angulo})"><ellipse class="petalo ${claro ? 'claro' : ''}" cx="0" cy="${-radioPetalo}" rx="${anchoPetalo * 0.5}" ry="${radioPetalo}" style="animation-delay:${delay}s"/></g>`;
    }
    html += `<circle class="centro-flor" r="${6.5 * escala}" style="animation-delay:${(retraso + 0.35).toFixed(2)}s"/>`;
    return html;
  }

  const config = {
    1: { escala: 0.85, retraso: 1.05, claro: false },
    2: { escala: 1.0,  retraso: 1.25, claro: true  },
    3: { escala: 1.15, retraso: 1.45, claro: false },
    4: { escala: 1.0,  retraso: 1.25, claro: true  },
    5: { escala: 0.85, retraso: 1.05, claro: false },
  };

  Object.entries(config).forEach(([num, cfg]) => {
    const g = document.querySelector(`[data-flor="${num}"]`);
    g.innerHTML = contenidoFlor(cfg.escala, cfg.retraso, cfg.claro);
  });
</script>

</body>
</html>
